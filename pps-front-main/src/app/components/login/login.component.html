<div class="login-container">
  <!-- Glowing background shapes -->
  <div class="glow-bg-blue"></div>
  <div class="glow-bg-gold"></div>

  <div class="login-card">
    <div class="brand-section">
      <h1 class="brand-title">MINISTERIO DE SEGURIDAD</h1>
      <p class="brand-subtitle">Sistema de informes de guardias</p>
    </div>

    <!-- Error Banner -->
    <div class="error-banner" *ngIf="errorMessage">
      <span class="error-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
      </span>
      <span class="error-text">{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="form-section">
      <!-- Input delLegajo -->
      <div class="input-group">
        <label for="legajo" class="input-label">Legajo Policial</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <input type="text" id="legajo" name="legajo" class="form-input" placeholder="Ingrese su legajo"
            [(ngModel)]="legajo" required autocomplete="username" [disabled]="isLoading" />
        </div>
      </div>

      <!-- Input Contraseña -->
      <div class="input-group">
        <label for="contrasena" class="input-label">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input [type]="showPassword ? 'text' : 'password'" id="contrasena" name="contrasena"
            class="form-input password-input" placeholder="Ingrese su contraseña" [(ngModel)]="contrasena" required
            autocomplete="current-password" [disabled]="isLoading" />
          <button type="button" class="password-toggle-btn" (click)="togglePasswordVisibility()" [disabled]="isLoading"
            title="Toggle password visibility">
            <!-- Toggle Eye Icon in SVG -->
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span class="btn-text" *ngIf="!isLoading">Ingresar</span>
        <div class="loader-spinner" *ngIf="isLoading"></div>
      </button>
    </form>

  </div>
</div>
