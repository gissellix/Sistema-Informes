<div class="guardia-container">

  <!-- ENCABEZADO -->
  <header class="guardia-header">
    <div class="header-brand">
      <span class="badge-accent">Jefe Policial</span>
      <h1 class="header-title">GUARDIA ACTIVA</h1>
    </div>
    <div class="user-info" *ngIf="currentUser">
      <span class="user-name">{{ currentUser.nombre }}</span>
      <span class="user-legajo">Legajo: {{ currentUser.legajo }}</span>
    </div>
  </header>

  <!-- CUERPO -->
  <main class="guardia-content">

    <!-- ESTADO ACTIVO + FECHA -->
    <section class="status-card">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-label">ESTADO: ACTIVO</span>
      </div>
      <div class="fecha-info">
        <span class="fecha-principal">{{ getFechaFormateada() }}</span>
        <span class="fecha-hora">Inicio de turno: {{ horaInicio }} hs</span>
      </div>
    </section>

    <!-- BOTONES PRINCIPALES -->
    <section class="acciones-principales">
      <button class="accion-btn btn-datos" (click)="registrarDatos()">
        <div class="accion-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
          </svg>
        </div>
        <div class="accion-texto">
          <span class="accion-nombre">Registrar Datos</span>
          <span class="accion-desc">Completar la información del turno</span>
        </div>
      </button>

      <button class="accion-btn btn-novedades" (click)="registrarNovedades()">
        <div class="accion-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="12" y1="18" x2="12" y2="12" />
            <line x1="9" y1="15" x2="15" y2="15" />
          </svg>
        </div>
        <div class="accion-texto">
          <span class="accion-nombre">Registrar Novedades</span>
          <span class="accion-desc">Cargar incidentes y novedades</span>
        </div>
      </button>
    </section>

    <!-- OPCIONES INFERIORES -->
    <section class="opciones-footer">
      <button class="footer-btn btn-atras" (click)="retroceder()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        <span>Atrás</span>
      </button>

      <button class="footer-btn btn-informe" (click)="verInformeFinal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
        </svg>
        <span>Vista previa del informe final</span>
      </button>
    </section>

  </main>
</div>
